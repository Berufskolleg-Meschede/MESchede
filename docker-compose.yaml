services:
  db:
    image: postgres:18.3-alpine3.23
    env_file:
      - ./backend/.env.db
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:

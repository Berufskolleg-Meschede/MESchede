services:
  mes-db:
    image: postgres:18.1-alpine3.23
    container_name: MES-Postgres
    restart: unless-stopped
    env_file: ./backend/.env.db
    volumes:
      - postgres_mes_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      mes-backend:
        aliases:
          - db

  backend:
    image: ghcr.io/berufskolleg-meschede/meschede-backend:${MES_IMAGE_TAG:-latest}
    container_name: MES-API
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      mes-db:
        condition: service_healthy
    networks:
      - mes-backend
      - SmartFactory
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mes-api.rule=Host(`mes-api.smartfactory.local`)"
      - "traefik.http.routers.mes-api.entrypoints=web"
      - "traefik.http.services.mes-api.loadbalancer.server.port=8000"

  mes-frontend:
    image: ghcr.io/berufskolleg-meschede/meschede-frontend:${MES_IMAGE_TAG:-latest}
    container_name: MES-Frontend
    restart: unless-stopped
    environment:
      MES_BACKEND_URL: http://backend:8000
    networks:
      - SmartFactory
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mes.rule=Host(`mes.smartfactory.local`)"
      - "traefik.http.routers.mes.entrypoints=web"
      - "traefik.http.services.mes.loadbalancer.server.port=3000"

volumes:
  postgres_mes_data:

networks:
  mes-backend:
    driver: bridge
  SmartFactory:
    name: SmartFactory
